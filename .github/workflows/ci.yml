# Proposed for Frozen-In-Flames/the-registry at .github/workflows/ci.yml
# Test command grounded in the repo layout: tests/ is a unittest package
# (tests/__init__.py present). The audit independently ran:
# python3 -m unittest discover. Standard library only in the test path
# (live USPTO and SEC EDGAR pulls are runtime features, not unit tests),
# so no pip install step is needed.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out patent-portfolio-apis for the USPTO wiring test
        uses: actions/checkout@v4
        with:
          repository: Frozen-In-Flames/patent-portfolio-apis
          path: patent-portfolio-apis-src
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the one dependency of the ppa USPTO client
        run: pip install requests
      - name: Unit tests
        env:
          PATENT_PORTFOLIO_APIS_DIR: ${{ github.workspace }}/patent-portfolio-apis-src
        run: python -m unittest discover
